[package]
name = "rtshark"
version = "3.2.0"
edition = "2021"
authors = ["CrabeDeFrance"]
license = "MIT OR Apache-2.0"
description = "A Rust interface for TShark"
repository = "https://github.com/CrabeDeFrance/rtshark"
homepage = "https://github.com/CrabeDeFrance/rtshark"
documentation = "https://docs.rs/rtshark"
readme = "README.md"
categories = ["network-programming", "api-bindings", "parser-implementations"]
keywords = ["wireshark", "tshark", "pcap", "network", "dissector"]
exclude = ["/.github"]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4", default-features = false }
quick-xml = { version = "0.37", features = ["tokio", "async-tokio"] }
semver = "1"
tokio = { version = "1.45", features = ["rt", "rt-multi-thread", "macros", "time", "sync"] }
tokio-stream = "0.1.17"
futures = "0.3"

[dev-dependencies]
libc = "0.2"
serial_test = "3"
tempdir = "0.3"

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.30", features = ["fs", "signal"] }
